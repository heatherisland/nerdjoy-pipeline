version: 2

models:
  - name: fct_funnel
    description: Application counts by funnel status.
    columns:
      - name: status
        tests: [not_null, unique]
      - name: application_count
        tests: [not_null]

  - name: dim_company
    description: Company grain. Contains real names, never published.
    columns:
      - name: company
        tests: [not_null, unique]
      - name: engagement_tier
        tests:
          - accepted_values:
              values: ["engaged", "multi-application", "single-application"]
      - name: crm_is_known
        description: True when HubSpot holds a company matching this name.
        tests: [not_null]
      - name: crm_lifecycle_stage
        description: >
          HubSpot lifecycle stage, null when crm_is_known is false. Not
          written by this pipeline, which is what makes it real enrichment.
        tests:
          - accepted_values:
              values: ["lead", "opportunity"]

  - name: mart_referral_scoring
    description: Hightouch source. Companies ranked by warm-intro priority.
    columns:
      - name: company
        tests: [not_null, unique]
      - name: referral_score
        tests: [not_null]

  - name: mart_public_metrics
    description: The only publishable mart. Aggregate values only, no names.
    columns:
      - name: metric_name
        tests: [not_null, unique]
      - name: metric_value
        tests: [not_null]

  - name: mart_channel_counts
    description: >
      Applications per application channel. Publishable: agency names are
      generalized upstream in pg_loader, so only tools and job boards remain.
    columns:
      - name: channel
        description: Generalized application channel.
        tests: [not_null, unique]
      - name: application_count
        description: Applications submitted through this channel.
        tests: [not_null]


  - name: mart_activity_monthly
    description: >
      Applications submitted per calendar month. Publishable: dates and
      counts only, no company or role detail.
    columns:
      - name: month
        description: Submission month as YYYY-MM.
        tests: [not_null, unique]
      - name: applied_count
        description: Applications submitted in this month.
        tests: [not_null]
