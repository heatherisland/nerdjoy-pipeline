version: 2

sources:
  - name: fivetran_supabase
    description: >
      Fivetran landing zone for the Supabase Postgres connector. Fivetran owns
      these tables and rewrites them on every sync; nothing here is edited by
      hand. The dataset name is Fivetran's own convention, derived from the
      connection name plus the source schema.
    database: "{{ env_var('BIGQUERY_PROJECT') }}"
    schema: supabase_postgres_public
    tables:
      - name: applications
        description: >
          One row per application, replicated from public.applications. Sync
          mode is soft delete, so removed source rows persist here with
          _fivetran_deleted = true and must be filtered downstream.
        columns:
          - name: application_key
            description: SHA-256 of 'company|role'.
            tests:
              - not_null
          - name: _fivetran_deleted
            description: True once the row is gone from the source.
          - name: _fivetran_synced
            description: When Fivetran last wrote this row.

  - name: fivetran_hubspot
    description: >
      Fivetran landing zone for the HubSpot connector. This closes the loop:
      Hightouch writes scored companies into HubSpot, and Fivetran brings
      HubSpot's own view back so the warehouse can see CRM state it does not
      itself produce. Only lifecyclestage is genuinely independent of this
      pipeline; the score and application-count properties are ones we wrote.
    database: "{{ env_var('BIGQUERY_PROJECT') }}"
    schema: hubspot
    tables:
      - name: company
        description: >
          One row per HubSpot company. Fivetran prefixes HubSpot properties
          with property_. Note 220 rows hold 209 distinct names and 11 rows
          have a null name, so this is deduplicated before joining.
        columns:
          - name: id
            description: HubSpot company id.
            tests:
              - not_null
              - unique
          - name: property_name
            description: Company name. The only available join key, and null on 11 rows.
          - name: property_lifecyclestage
            description: HubSpot lifecycle stage. Not written by this pipeline.
